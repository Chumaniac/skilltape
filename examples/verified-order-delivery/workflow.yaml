{
  "schema": "skilltape.dev/workflow/v1",
  "steps": [
    {
      "id": "summarize",
      "action": "exec",
      "program": "/usr/bin/perl",
      "args": [
        "scripts/summarize_orders.pl",
        "--input",
        "inputs/orders.csv",
        "--output-dir",
        "outputs"
      ],
      "timeout_ms": 3000,
      "outputs": [
        {
          "path": "outputs/metrics.csv",
          "type": "file"
        },
        {
          "path": "outputs/summary.json",
          "type": "file"
        }
      ]
    }
  ]
}
