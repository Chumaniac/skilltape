{
  "schema": "skilltape.dev/skill/v1",
  "name": "knowledge-reference",
  "version": "0.1.0",
  "description": "Knowledge reference handoff using a guarded workspace and SHA-256 assertions.",
  "engine": {
    "min_version": "0.1.0"
  },
  "entrypoint": {
    "workflow": "workflow.yaml",
    "permissions": "permissions.json",
    "lockfile": "skilltape.lock"
  },
  "inputs": [
    {
      "id": "knowledge",
      "type": "directory",
      "required": true,
      "description": "Small synthetic fixtures supplied with --input."
    }
  ],
  "outputs": [
    {
      "id": "artifact-0",
      "type": "file",
      "path": "outputs/knowledge/note.md"
    },
    {
      "id": "artifact-1",
      "type": "file",
      "path": "outputs/knowledge/source.md"
    }
  ],
  "targets": [
    "generic-agent-skill",
    "claude-code",
    "codex",
    "cursor"
  ],
  "x-domain": "content-knowledge"
}
