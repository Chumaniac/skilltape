[workspace]
members = [
  "crates/skilltape-capture",
  "crates/skilltape-tape",
  "crates/skilltape-schema",
  "crates/skilltape-compiler",
  "crates/skilltape-core",
  "crates/skilltape-cli",
  "crates/skilltape-policy",
  "crates/skilltape-runner",
  "crates/skilltape-verify",
  "crates/skilltape-export",
  "apps/skilltape-console-api",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
axum = "0.8"
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
jsonschema = "0.26"
libc = "0.2"
notify = "8"
predicates = "3"
portable-pty = "0.9"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
