name: Feature request
description: Suggest an improvement to SkillTape.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape SkillTape. Do not use this form for security vulnerabilities or exploit details; follow [SECURITY.md](https://github.com/Chumaniac/skilltape/blob/main/SECURITY.md) instead.

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem would this feature solve, and who would benefit?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the behavior or interface you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workaround or alternative approach you considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add safe examples, links, or screenshots that clarify the request.
    validations:
      required: false

  - type: checkboxes
    id: existing_work
    attributes:
      label: Preparation
      options:
        - label: I have searched existing Issues and did not find a matching request.
          required: true
