name: User edition source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - run: npm ci --prefix apps/skilltape-console --ignore-scripts
      - run: npm --prefix apps/skilltape-console run build
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p skilltape-cli
      - run: python3 scripts/test_request_import.py
      - run: python3 -m unittest discover -s desktop/tests

      - name: Check stopped-workspace backup and new-directory recovery
        run: python3 -m unittest discover -s scripts/tests -p test_workspace_backup.py
