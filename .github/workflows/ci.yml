name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Install Linux replay sandbox
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04's AppArmor policy can block bubblewrap from
          # configuring the loopback-only network namespace on hosted runners.
          if test -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if test -e /proc/sys/kernel/unprivileged_userns_clone; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
          probe_root="$(mktemp -d)"
          bwrap \
            --die-with-parent \
            --new-session \
            --unshare-all \
            --proc /proc \
            --dev /dev \
            --tmpfs /tmp \
            --clearenv \
            --setenv PATH /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --ro-bind /usr /usr \
            --ro-bind /bin /bin \
            --ro-bind /lib /lib \
            --ro-bind /lib64 /lib64 \
            --ro-bind /etc /etc \
            --bind "$probe_root" /workspace \
            --chdir /workspace \
            -- \
            /bin/true

      - name: Check macOS replay sandbox
        if: matrix.os == 'macos-14'
        run: |
          test -x /usr/bin/sandbox-exec
          /usr/bin/sandbox-exec -p '(version 1) (import "system.sb") (allow process-exec)' /usr/bin/true

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --locked --workspace -- --test-threads=1

      - name: Run product security and journey gates
        run: >-
          cargo test --locked -p skilltape-cli
          --test security_path_escape
          --test security_secret_leak
          --test integration_full_journey
          -- --test-threads=1

      - name: Lint valid example
        run: cargo run --locked -p skilltape-cli -- lint examples/minimal-skill

      - name: Assert invalid fixture fails with policy code
        shell: bash
        run: |
          set +e
          cargo run --locked -p skilltape-cli -- lint tests/fixtures/invalid-skill
          rc=$?
          set -e
          test "$rc" -eq 3

      - name: Validate release and installer fixtures
        shell: bash
        run: |
          python3 scripts/test_release_package.py
          python3 scripts/test_release_workflow.py
          bash -n scripts/install.sh scripts/test_install.sh scripts/smoke_console.sh
          bash scripts/test_install.sh

  console:
    name: Console (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/skilltape-console/package-lock.json

      - name: Install Console dependencies
        run: npm ci --prefix apps/skilltape-console

      - name: Install Playwright Chromium with Linux dependencies
        if: runner.os == 'Linux'
        run: npx --prefix apps/skilltape-console playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os == 'macOS'
        run: npx --prefix apps/skilltape-console playwright install chromium

      - name: Build Console
        run: npm --prefix apps/skilltape-console run build

      - name: Run Console browser tests
        run: npm --prefix apps/skilltape-console test
